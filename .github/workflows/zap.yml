name: OWASP ZAP

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL pública que se analizará
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo de seguridad pasivo
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: false
          allow_issue_writing: true
